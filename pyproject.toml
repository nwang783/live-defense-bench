[project]
name = "live-defense-bench"
version = "1.0.0"
description = "A benchmark in which an AI model defends a fictional company network against a scripted replay intruder."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kalligator" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.3.0",
    "blaxel>=0.4.12,<0.5",
    "openai>=3.40.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
live-defense-bench = "live_defense_bench:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
