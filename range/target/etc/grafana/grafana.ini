# Larkspur ops dashboard. Managed by hand; see the ops notes in the shared drive.
[server]
http_port = 3000
domain = larkspurcycles.com
root_url = http://larkspurcycles.com:3000/

[security]
admin_user = admin
admin_password = @ADMIN@

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[smtp]
enabled = true
host = smtp.mailgun.org:587
user = deploy@mg.larkspurcycles.com
password = @SMTP@
from_address = alerts@larkspurcycles.com
from_name = Larkspur Grafana

[external_image_storage]
provider = s3

[external_image_storage.s3]
bucket = larkspur-grafana-snapshots
region = us-east-1
access_key = AKIAQ7LARKSPURGRAF01
secret_key = @S3_SECRET@

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = file
